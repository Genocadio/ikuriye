query PackageById($id: ID!) {
  package(id: $id) {
    id
    trackingCode
    deliveryType
    status
    creatorId
    custodians {
      id
      userId
      name
      phone
      role
      assignedAt
    }
    people {
      id
      role
      userId
      name
      phone
    }
    locations {
      id
      type
      placeName
      latitude
      longitude
    }
    details {
      category
      description
      fragile
      weight
      media {
        id
        url
        mimeType
      }
    }
    events {
      id
      eventType
      actorId
      description
      createdAt
    }
    custody {
      id
      fromEntity
      toEntity
      timestamp
      notes
    }
    createdAt
    updatedAt
  }
}
