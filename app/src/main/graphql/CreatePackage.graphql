mutation CreatePackage($input: CreatePackageInput!) {
  createPackage(input: $input) {
    deliveryPackage {
      id
      trackingCode
      deliveryType
      status
      creatorId
      custodians {
        id
        userId
        name
        phone
        role
        assignedAt
      }
      people {
        id
        role
        userId
        name
        phone
      }
      locations {
        id
        type
        placeName
        latitude
        longitude
      }
      details {
        category
        description
        fragile
        weight
        media {
          id
          url
          mediaType
          createdAt
        }
      }
      events {
        id
        eventType
        description
        createdAt
      }
      createdAt
      updatedAt
    }
    handoverToken
    transfer {
      id
      ruleType
      status
    }
  }
}
