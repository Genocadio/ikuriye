query PackageByTrackingCode($code: String!) {
  packageByTrackingCode(code: $code) {
    id
    trackingCode
    deliveryType
    status
    creatorId
    custodians {
      id
      userId
      name
      phone
      role
      assignedAt
    }
    people {
      id
      role
      userId
      name
      phone
    }
    locations {
      id
      type
      placeName
      latitude
      longitude
    }
    details {
      category
      description
      fragile
      weight
      media {
        id
        url
        mimeType
      }
    }
    events {
      id
      eventType
      description
      createdAt
    }
    transfers {
      id
      ruleType
      status
    }
    createdAt
    updatedAt
  }
}
