mutation UpdatePackageStatus($input: UpdatePackageStatusInput!) {
  updatePackageStatus(input: $input) {
    id
    trackingCode
    deliveryType
    status
    creatorId
    custodians {
      id
      userId
      name
      phone
      role
      assignedAt
    }
    people {
      id
      role
      userId
      name
      phone
    }
    locations {
      id
      type
      placeName
      latitude
      longitude
    }
    details {
      category
      description
      fragile
      weight
      media {
        url
      }
    }
    events {
      id
      eventType
      description
      createdAt
    }
    createdAt
    updatedAt
  }
}
