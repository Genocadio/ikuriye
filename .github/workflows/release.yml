
  name: Release

  # Builds a signed production APK and publishes it
  # to GitHub Releases whenever a version tag is pushed.
  #
  # Example:
  #   git tag v1.0.0
  #   git push origin v1.0.0

  on:
    push:
      tags:
        - "v*"

  permissions:
    contents: write

  jobs:
    release:
      name: Build & publish ${{ github.ref_name }}

      runs-on: ubuntu-latest

      timeout-minutes: 60

      # Make GitHub Secrets available to EVERY step.
      # Gradle reads these through System.getenv().
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        GRAPHQL_URL: ${{ secrets.GRAPHQL_URL }}
        MEDIA_BUCKET: ${{ secrets.MEDIA_BUCKET }}
        PROFILE_BUCKET: ${{ secrets.PROFILE_BUCKET }}
        NEXXAUTH_BASE_URL: ${{ secrets.NEXXAUTH_BASE_URL }}
        NEXXAUTH_CLIENT_ID: ${{ secrets.NEXXAUTH_CLIENT_ID }}

        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      steps:

        # ------------------------------------------------------------
        # 1. Checkout repository
        # ------------------------------------------------------------
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # ------------------------------------------------------------
        # 2. Set up Java
        # ------------------------------------------------------------
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "21"
            cache: gradle

        # ------------------------------------------------------------
        # 3. Set up Gradle
        # ------------------------------------------------------------
        - name: Set up Gradle
          uses: gradle/actions/setup-gradle@v4

        # ------------------------------------------------------------
        # 4. Make Gradle wrapper executable
        # ------------------------------------------------------------
        - name: Make Gradle wrapper executable
          run: chmod +x ./gradlew

        # ------------------------------------------------------------
        # 5. Check required secrets
        # ------------------------------------------------------------
        - name: Check required secrets
          shell: bash
          run: |
            set -e
            
            missing=""
            
            required_vars=(
              SUPABASE_URL
              SUPABASE_KEY
              GRAPHQL_URL
              NEXXAUTH_BASE_URL
              NEXXAUTH_CLIENT_ID
              KEYSTORE_BASE64
              KEYSTORE_PASSWORD
              KEY_ALIAS
              KEY_PASSWORD
            )
            
            for var in "${required_vars[@]}"; do
              if [ -z "${!var:-}" ]; then
                missing="$missing $var"
              fi
            done
            
            if [ -n "$missing" ]; then
              echo "::error::Missing required GitHub Secrets:$missing"
              echo "::error::Go to Settings → Secrets and variables → Actions"
              exit 1
            fi
            
            echo "All required secrets are present."
            
            if [ -z "${MEDIA_BUCKET:-}" ]; then
              echo "MEDIA_BUCKET is not set; Gradle default will be used."
            fi
            
            if [ -z "${PROFILE_BUCKET:-}" ]; then
              echo "PROFILE_BUCKET is not set; Gradle default will be used."
            fi

        # ------------------------------------------------------------
        # 6. Compute Android version from Git tag
        #
        # v1.2.3 -> VERSION_NAME=1.2.3
        # ------------------------------------------------------------
        - name: Compute version
          shell: bash
          run: |
            set -e
            
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$(git rev-list --count HEAD)"
            
            if [ -z "$VERSION_NAME" ]; then
              echo "::error::Could not determine VERSION_NAME"
              exit 1
            fi
            
            if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid VERSION_CODE: $VERSION_CODE"
              exit 1
            fi
            
            echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
            
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"

        # ------------------------------------------------------------
        # 7. Show build environment
        # ------------------------------------------------------------
        - name: Show build environment
          run: |
            echo "Java:"
            java -version
            
            echo
            echo "Gradle:"
            ./gradlew --version
            
            echo
            echo "Android SDK:"
            echo "${ANDROID_HOME}"

        # ------------------------------------------------------------
        # 8. Run unit tests
        # ------------------------------------------------------------
        - name: Run unit tests
          run: |
            ./gradlew :app:testDebugUnitTest

        # ------------------------------------------------------------
        # 9. Build signed production APK ONLY
        # ------------------------------------------------------------
        - name: Build signed release APK
          run: |
            ./gradlew \
              :app:assembleRelease \
              --stacktrace

        # ------------------------------------------------------------
        # 10. Show generated APK
        # ------------------------------------------------------------
        - name: Show release APK
          run: |
            find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print

        # ------------------------------------------------------------
        # 11. Verify APK exists
        # ------------------------------------------------------------
        - name: Verify APK exists
          shell: bash
          run: |
            set -e
            
            APK="app/build/outputs/apk/release/app-release.apk"
            
            if [ ! -f "$APK" ]; then
              echo "::error::Release APK was not generated."
              exit 1
            fi
            
            echo "APK found:"
            ls -lh "$APK"

        # ------------------------------------------------------------
        # 12. Verify APK signature
        # ------------------------------------------------------------
        - name: Verify APK signature
          shell: bash
          run: |
            set -e
            
            APK="app/build/outputs/apk/release/app-release.apk"
            
            APKSIGNER="$(
              find "${ANDROID_HOME}/build-tools" \
                -type f \
                -name apksigner \
                | sort -V \
                | tail -1
            )"
            
            if [ -z "$APKSIGNER" ]; then
              echo "::error::apksigner was not found."
              exit 1
            fi
            
            echo "Using:"
            echo "$APKSIGNER"
            
            echo
            echo "APK signature:"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            
            echo
            echo "APK signature verification successful."

        # ------------------------------------------------------------
        # 13. Rename APK with version
        # ------------------------------------------------------------
        - name: Rename APK
          shell: bash
          run: |
            set -e
            
            APK="app/build/outputs/apk/release/app-release.apk"
            RELEASE_APK="ikuriye-v${VERSION_NAME}.apk"
            
            cp "$APK" "$RELEASE_APK"
            
            echo "Release APK:"
            ls -lh "$RELEASE_APK"
            
            echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

        # ------------------------------------------------------------
        # 14. Create GitHub Release
        # ------------------------------------------------------------
        - name: Publish GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            name: Ikuriye ${{ env.VERSION_NAME }}

            generate_release_notes: true

            files: |
              ${{ env.RELEASE_APK }}

            fail_on_unmatched_files: true

        # ------------------------------------------------------------
        # 15. Final message
        # ------------------------------------------------------------
        - name: Release complete
          run: |
            echo "========================================"
            echo "Ikuriye release completed successfully"
            echo "Version: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "Tag: $GITHUB_REF_NAME"
            echo "APK: $RELEASE_APK"
            echo "========================================"

